name: Release

# Push a tag like `v0.1.0` to build the installers and publish a GitHub Release.
# Run it by hand from the Actions tab, or open a pull request that changes packaging,
# to only build the installers.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, like v0.1.0. Leave empty to only build."
        required: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - assets/icons/**
      - installer/**
      - build.rs
      - Cargo.toml

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="${INPUT_TAG:-v$version}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          test "$tag" = "v$version" || { echo "Tag does not match Cargo.toml"; exit 1; }
          publish=false
          build=true
          if [[ "$GITHUB_EVENT_NAME" == push || -n "$INPUT_TAG" ]]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              build=false
            else
              publish=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: wix
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev clang \
            libfuse2t64
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version ${{ env.CARGO_PACKAGER_VERSION }}
      - name: Check formatting and tests
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          SNAPT_EXE="$PWD/target/${{ matrix.target }}/release/snapt.exe" \
            cargo build --release --locked -p snapt-setup --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/snapt-setup.exe "target/packages/snapt_${version}_x64-setup.exe"
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find target/packages -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # 0.x versions and tags like v1.0.0-beta.1 are marked as pre-releases.
          flags=()
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          # Published versions are never replaced by a later workflow run.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its files unchanged."
            exit 0
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Snapt ${TAG#v}" --notes-file .github/release-notes.md --generate-notes "${flags[@]}"
